name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PGRX_VERSION: "0.18.1"

jobs:
  test:
    name: test ${{ matrix.pg }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pg: [pg16, pg17, pg18]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the upgrade test builds earlier release tags

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex libreadline-dev zlib1g-dev \
            libicu-dev pkg-config libclang-dev clang

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ matrix.pg }}-${{ hashFiles('Cargo.toml') }}

      - name: Cache pgrx-managed PostgreSQL
        uses: actions/cache@v6
        with:
          path: ~/.pgrx
          key: pgrx-${{ runner.os }}-${{ matrix.pg }}-${{ env.PGRX_VERSION }}

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --version "=${{ env.PGRX_VERSION }}" --locked

      - name: Initialize pgrx (build ${{ matrix.pg }} from source)
        run: cargo pgrx init --${{ matrix.pg }} download

      - name: Clippy (pg18 only; needs initialized pgrx)
        if: matrix.pg == 'pg18'
        run: |
          rustup component add clippy
          cargo clippy --no-default-features --features pg18,pg_test -- -D warnings

      - name: Run tests
        run: cargo pgrx test ${{ matrix.pg }}

      - name: Run multi-session tests
        run: |
          PG_CONFIG="$(cargo pgrx info pg-config ${{ matrix.pg }})"
          MAJOR="${{ matrix.pg }}"; MAJOR="${MAJOR#pg}"
          cargo pgrx install --no-default-features --features ${{ matrix.pg }} --pg-config "$PG_CONFIG"
          cargo pgrx start ${{ matrix.pg }}
          PATH="$(dirname "$PG_CONFIG"):$PATH" PGHOST=localhost PGPORT=$((28800 + MAJOR)) \
            tests/multisession.sh

      - name: Run hot standby tests
        run: |
          export PATH="$(dirname "$(cargo pgrx info pg-config ${{ matrix.pg }})"):$PATH"
          HOT_STANDBY_FEEDBACK=off tests/standby.sh
          HOT_STANDBY_FEEDBACK=on tests/standby.sh

      - name: Run upgrade tests (pg18 only)
        if: matrix.pg == 'pg18'
        run: |
          tests/upgrade.sh "$(cargo pgrx info pg-config pg18)" v0.1.2
          tests/upgrade.sh "$(cargo pgrx info pg-config pg18)" v0.1.1

  postgis:
    name: postgis (pg16)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the upgrade test builds earlier release tags

      - name: Install PostgreSQL 16 + PostGIS + build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-16 postgresql-server-dev-16 postgresql-16-postgis-3 \
            build-essential libreadline-dev zlib1g-dev libicu-dev \
            pkg-config libclang-dev clang
          sudo systemctl stop postgresql || true

      - name: Make the extension install dirs writable for pgrx
        run: |
          PGBIN=/usr/lib/postgresql/16/bin
          sudo chmod -R a+w "$($PGBIN/pg_config --pkglibdir)" \
                            "$($PGBIN/pg_config --sharedir)/extension"

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-postgis-${{ hashFiles('Cargo.toml') }}

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --version "=${{ env.PGRX_VERSION }}" --locked

      - name: Point pgrx at the system PostgreSQL 16
        run: cargo pgrx init --pg16 /usr/lib/postgresql/16/bin/pg_config

      - name: Run tests (PostGIS available -> geometry test runs for real)
        run: cargo pgrx test pg16

      - name: Run upgrade test (with PostGIS)
        run: tests/upgrade.sh /usr/lib/postgresql/16/bin/pg_config

  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check
